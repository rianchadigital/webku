<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1700" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="skyOceanBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="25%" stop-color="#bae6fd" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#f0f9ff" />
    </linearGradient>

    <!-- Green Header Pill -->
    <linearGradient id="pillGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#008844" />
      <stop offset="50%" stop-color="#00aa55" />
      <stop offset="100%" stop-color="#008844" />
    </linearGradient>

    <filter id="pillShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1700" fill="url(#skyOceanBg)" />

  <!-- Background Soft Wave Layers -->
  <path d="M 0 0 Q 400 120 800 40 L 800 0 Z" fill="#ffffff" opacity="0.6" />
  <path d="M 0 1100 Q 400 1250 800 1120 L 800 1700 L 0 1700 Z" fill="#ffffff" opacity="0.4" />
  <path d="M 0 1350 Q 400 1480 800 1380 L 800 1700 L 0 1700 Z" fill="#c7d2fe" opacity="0.2" />

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(0, 30)">
    <!-- Left: Lambang Jaya Raya DKI Jakarta -->
    <g transform="translate(80, 50) scale(0.9)">
      <path d="M -32 -48 L 32 -48 L 32 0 C 32 30, 0 45, 0 45 C 0 45, -32 30, -32 0 Z" fill="#ffffff" stroke="#d97706" stroke-width="2.5" />
      <path d="M -28 -44 L 28 -44 L 28 -2 C 28 26, 0 38, 0 38 C 0 38, -28 26, -28 -2 Z" fill="#0284c7" />
      <path d="M -5 15 L 5 15 L 3 -18 L -3 -18 Z" fill="#ffffff" />
      <polygon points="0,-30 -3,-18 3,-18" fill="#fbbf24" stroke="#d97706" stroke-width="1" />
      <rect x="-12" y="15" width="24" height="5" fill="#ffffff" rx="1" />
      <path d="M -20 24 Q -10 20 0 24 Q 10 28 20 24" stroke="#ffffff" stroke-width="2" fill="none" />
      <rect x="-32" y="-60" width="64" height="14" fill="#e11d48" rx="2" stroke="#b91c1c" stroke-width="1" />
      <text x="0" y="-50" fill="#ffffff" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="7.5" font-weight="900" letter-spacing="1" text-anchor="middle">JAYA RAYA</text>
    </g>

    <!-- Center: Kop Surat Puskesmas -->
    <g text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" fill="#0f172a">
      <text x="400" y="32" font-size="16" font-weight="900" letter-spacing="0.5">PUSAT KESEHATAN MASYARAKAT KECAMATAN</text>
      <text x="400" y="54" font-size="16" font-weight="900" letter-spacing="0.5">KEPULAUAN SERIBU SELATAN</text>
      <text x="400" y="74" font-size="15" font-weight="800" letter-spacing="0.5">DINAS KESEHATAN</text>
      <text x="400" y="94" font-size="14" font-weight="800" letter-spacing="0.5">PROVINSI DAERAH KHUSUS IBUKOTA JAKARTA</text>
    </g>

    <!-- Right: Lambang Kesehatan / Kemenkes Palang Hijau -->
    <g transform="translate(720, 50) scale(0.9)">
      <polygon points="0,-48 38,-26 38,26 0,48 -38,26 -38,-26" fill="#ffffff" stroke="#047857" stroke-width="2.5" />
      <circle cx="0" cy="0" r="28" fill="#ffffff" stroke="#047857" stroke-width="1.5" />
      <!-- Green Cross -->
      <path d="M -7 -20 L 7 -20 L 7 -7 L 20 -7 L 20 7 L 7 7 L 7 20 L -7 20 L -7 7 L -20 7 L -20 -7 L -7 -7 Z" fill="#047857" />
    </g>
  </g>

  <!-- ==================== HAK PASIEN ==================== -->
  <g transform="translate(0, 180)">
    <!-- Big Green Pill Banner -->
    <g filter="url(#pillShadow)" transform="translate(400, 20)">
      <rect x="-260" y="-30" width="520" height="60" rx="30" fill="url(#pillGreen)" stroke="#ffffff" stroke-width="3" />
      <text x="0" y="11" fill="#fef08a" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="2" text-anchor="middle">
        HAK PASIEN
      </text>
    </g>

    <!-- 12 List Items of Hak Pasien -->
    <g transform="translate(55, 95)" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="800" fill="#0f172a">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <text x="0" y="0">1. MEMPEROLEH INFORMASI MENGENAI TATA TERTIB DAN PERATURAN YANG</text>
        <text x="18" y="17">BERLAKU</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(0, 42)">
        <text x="0" y="0">2. MEMPEROLEH INFORMASI TENTANG HAK DAN KEWAJIBAN PASIEN</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 72)">
        <text x="0" y="0">3. MEMPEROLEH LAYANAN YANG MANUSIAWI, ADIL, JUJUR DAN TANPA</text>
        <text x="18" y="17">DISKRIMINASI</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 114)">
        <text x="0" y="0">4. MEMPEROLEH PELAYANAN KESEHATAN YANG BERMUTU SESUAI DENGAN</text>
        <text x="18" y="17">STANDAR PROFESI DAN STANDAR PROSEDUR</text>
      </g>

      <!-- Item 5 -->
      <g transform="translate(0, 156)">
        <text x="0" y="0">5. MEMPEROLEH PELAYANAN YANG EFEKTIF DAN EFESIEN SEHINGGA PASIEN</text>
        <text x="18" y="17">TERHINDAR DARI KERUGIAN FISIK</text>
      </g>

      <!-- Item 6 -->
      <g transform="translate(0, 198)">
        <text x="0" y="0">6. MEMILIH DOKTER SESUAI DENGAN KEINGINANYA DAN PERATURAN YANG</text>
        <text x="18" y="17">BERLAKU DI PUSKESMAS</text>
      </g>

      <!-- Item 7 -->
      <g transform="translate(0, 240)">
        <text x="0" y="0">7. MEMINTA KONSULTASI TENTANG PENYAKIT YANG DI DERITANYA KEPADA</text>
        <text x="18" y="17">DOKTER LAIN</text>
      </g>

      <!-- Item 8 -->
      <g transform="translate(0, 282)">
        <text x="0" y="0">8. MENDAPAT PRIVASI DAN KERAHASIAN YANG DIDERITANYA TERMASUK DATA-</text>
        <text x="18" y="17">DATA MEDISNYA</text>
      </g>

      <!-- Item 9 -->
      <g transform="translate(0, 324)">
        <text x="0" y="0">9. MEMBERIKAN PERSETUJUAN ATAU MENOLAK ATAS TINDAKAN YANG AKAN</text>
        <text x="18" y="17">DILAKUKAN OLEH TENAGA KESEHATAN TERHADAP PENYAKIT YANG</text>
        <text x="18" y="34">DIDERITANYA</text>
      </g>

      <!-- Item 10 -->
      <g transform="translate(0, 383)">
        <text x="0" y="0">10. MENDAPAT INFORMASI MELIPUTI DIAGNOSA DAN TATA CARA TINDAKAN</text>
        <text x="24" y="17">MEDIS, TUJUAN TINDAKAN MEDIS, ALTERNATIF TINDAKAN, RISIKO DAN</text>
        <text x="24" y="34">KOMPLIKASI YANG MUNGKIN TERJADI DAN PROGNOSIS TINDAKAN YANG</text>
        <text x="24" y="51">DILAKUKAN</text>
      </g>

      <!-- Item 11 -->
      <g transform="translate(0, 459)">
        <text x="0" y="0">11. MEMPEROLEH KEAMANAN DAN KESELAMATAN DIRINYA SELAMA PERAWATAN</text>
        <text x="24" y="17">DI PUSKESMAS</text>
      </g>

      <!-- Item 12 -->
      <g transform="translate(0, 501)">
        <text x="0" y="0">12. MENGAJUKAN USUL DAN SARAN, PERBAIKAN ATAS PERLAKUAN PUSKESMAS</text>
        <text x="24" y="17">TERHADAP DIRINYA</text>
      </g>
    </g>
  </g>

  <!-- ==================== KEWAJIBAN PASIEN ==================== -->
  <g transform="translate(0, 830)">
    <!-- Big Green Pill Banner -->
    <g filter="url(#pillShadow)" transform="translate(400, 30)">
      <rect x="-290" y="-30" width="580" height="60" rx="30" fill="url(#pillGreen)" stroke="#ffffff" stroke-width="3" />
      <text x="0" y="11" fill="#fef08a" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="2" text-anchor="middle">
        KEWAJIBAN PASIEN
      </text>
    </g>

    <!-- 4 List Items of Kewajiban Pasien -->
    <g transform="translate(55, 120)" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#0f172a">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <text x="0" y="0">1. MEMBERIKAN INFORMASI YANG LENGKAP DAN JUJUR</text>
        <text x="20" y="22">TENTANG MASALAH KESEHATANNYA</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(0, 56)">
        <text x="0" y="0">2. MEMATUHI NASEHAT DAN PETUNJUK TENAGA</text>
        <text x="20" y="22">KESEHATAN YANG KOMPETEN</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 112)">
        <text x="0" y="0">3. MEMATUHI KETENTUAN YANG BERLAKU DI SARANA</text>
        <text x="20" y="22">PELAYANAN KESEHATAN</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 168)">
        <text x="0" y="0">4. MEMBERIKAN IMBALAN JASA ATAS PELAYANAN</text>
        <text x="20" y="22">YANG DITERIMA, KECUALI YANG MEMPUNYA</text>
        <text x="20" y="44">ASURANSI</text>
      </g>
    </g>
  </g>

  <!-- ==================== MEDICAL ILLUSTRATION ==================== -->
  <g transform="translate(400, 1370)">
    <!-- Wheelchair Patient and Medical Staff -->
    <!-- Wheelchair Wheel -->
    <circle cx="-160" cy="110" r="50" fill="none" stroke="#0284c7" stroke-width="7" />
    <circle cx="-160" cy="110" r="12" fill="#0284c7" />
    <!-- Spokes -->
    <line x1="-210" y1="110" x2="-110" y2="110" stroke="#0284c7" stroke-width="2.5" />
    <line x1="-160" y1="60" x2="-160" y2="160" stroke="#0284c7" stroke-width="2.5" />
    <line x1="-195" y1="75" x2="-125" y2="145" stroke="#0284c7" stroke-width="2.5" />
    <line x1="-195" y1="145" x2="-125" y2="75" stroke="#0284c7" stroke-width="2.5" />

    <!-- Wheelchair Frame -->
    <path d="M -200 60 L -160 110 L -100 110 L -90 140" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round" />
    <circle cx="-90" cy="145" r="14" fill="#334155" />
    <path d="M -190 30 L -150 75 L -100 75" fill="none" stroke="#0f172a" stroke-width="6" stroke-linecap="round" />

    <!-- Patient on Wheelchair -->
    <!-- Head & Cap -->
    <circle cx="-130" cy="-10" r="22" fill="#fed7aa" />
    <path d="M -152 -18 Q -130 -40 -108 -18 Z" fill="#0284c7" />
    <!-- Torso -->
    <path d="M -150 15 C -150 15, -135 70, -115 70 C -100 70, -100 15, -115 15 Z" fill="#67e8f9" />
    <!-- Arm -->
    <path d="M -135 25 L -115 55 L -140 70" fill="none" stroke="#fed7aa" stroke-width="9" stroke-linecap="round" />

    <!-- Standing Nurse 1 (Female Hijab) -->
    <g transform="translate(-30, -50)">
      <!-- Head / Hijab -->
      <path d="M -25 25 C -25 -20, 25 -20, 25 25 C 25 35, 18 45, 0 45 C -18 45, -25 35, -25 25 Z" fill="#38bdf8" />
      <circle cx="0" cy="22" r="16" fill="#fed7aa" />
      <!-- Medical Uniform -->
      <path d="M -26 48 L 26 48 L 30 180 L -30 180 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <path d="M -30 180 L -32 230 L -10 230 L -8 180 Z" fill="#0284c7" />
      <path d="M 8 180 L 10 230 L 32 230 L 30 180 Z" fill="#0284c7" />
      <!-- Stethoscope -->
      <path d="M -14 55 Q 0 95 14 55" fill="none" stroke="#475569" stroke-width="3" />
      <circle cx="0" cy="98" r="5" fill="#475569" />
    </g>

    <!-- Standing Doctor 2 (Male with Clipboard) -->
    <g transform="translate(75, -60)">
      <!-- Head -->
      <circle cx="0" cy="18" r="20" fill="#fed7aa" />
      <path d="M -20 10 Q 0 -10 20 8 C 20 8, 16 0, 0 0 C -16 0, -20 10, -20 10 Z" fill="#334155" />
      <!-- Doctor Lab Coat -->
      <path d="M -30 46 L 30 46 L 35 190 L -35 190 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <polygon points="-8,46 0,75 8,46" fill="#0284c7" />
      <!-- Legs -->
      <rect x="-26" y="190" width="22" height="50" fill="#1e293b" rx="4" />
      <rect x="4" y="190" width="22" height="50" fill="#1e293b" rx="4" />
      <!-- Clipboard Folder -->
      <rect x="18" y="80" width="34" height="46" rx="4" fill="#d97706" />
      <rect x="22" y="86" width="26" height="34" rx="2" fill="#ffffff" />
      <rect x="26" y="76" width="18" height="7" rx="2" fill="#475569" />
    </g>

    <!-- Standing Nurse 3 (Female Hijab Right) -->
    <g transform="translate(180, -40)">
      <!-- Head / Hijab -->
      <path d="M -22 25 C -22 -18, 22 -18, 22 25 C 22 35, 15 45, 0 45 C -15 45, -22 35, -22 25 Z" fill="#34d399" />
      <circle cx="0" cy="22" r="15" fill="#fed7aa" />
      <!-- Uniform -->
      <path d="M -24 48 L 24 48 L 28 175 L -28 175 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Legs -->
      <rect x="-22" y="175" width="18" height="45" fill="#047857" rx="4" />
      <rect x="4" y="175" width="18" height="45" fill="#047857" rx="4" />
    </g>
  </g>

  <!-- ==================== SOCIAL MEDIA FOOTER ==================== -->
  <g transform="translate(0, 1610)">
    <!-- Dark Emerald Green Bar -->
    <rect width="800" height="90" fill="#047857" />

    <!-- Center Line Divider -->
    <line x1="430" y1="15" x2="430" y2="75" stroke="#10b981" stroke-width="2" />

    <!-- Facebook Group -->
    <g transform="translate(110, 48)">
      <!-- FB Circular Icon -->
      <circle cx="0" cy="0" r="18" fill="#ffffff" />
      <path d="M -3 9 L 3 9 L 3 0 L 7 0 L 8 -5 L 3 -5 L 3 -8 C 3 -9.5 4 -10 6 -10 L 8 -10 L 8 -15 L 4 -15 C -0.5 -15, -3 -12.5, -3 -8 L -3 -5 L -7 -5 L -7 0 L -3 0 Z" fill="#047857" />
      <!-- Text -->
      <text x="32" y="6" fill="#ffffff" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="800">
        Puskesmas Seribu Selatan
      </text>
    </g>

    <!-- Instagram Group -->
    <g transform="translate(460, 48)">
      <!-- Instagram Rounded Rect Icon -->
      <rect x="-18" y="-18" width="36" height="36" rx="9" fill="#ffffff" />
      <rect x="-12" y="-12" width="24" height="24" rx="6" fill="none" stroke="#047857" stroke-width="2.5" />
      <circle cx="0" cy="0" r="6" fill="none" stroke="#047857" stroke-width="2.5" />
      <circle cx="6" cy="-6" r="1.5" fill="#047857" />
      <!-- Text -->
      <text x="30" y="6" fill="#ffffff" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="800">
        puskesmasseribuselatan
      </text>
    </g>
  </g>
</svg>
