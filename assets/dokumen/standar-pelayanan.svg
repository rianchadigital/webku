        <text x="0" y="16">• Gudang Obat Vaksin Berpendingin (Cold Chain) &amp; Tabung Oksigen Siaga.</text>
        <text x="0" y="32">• Rekam Medis Elektronik (RME) Bridging SatuSehat &amp; BPJS P-Care.</text>
      </g>
    </g>

    <!-- Row 7: Kompetensi Pelaksana -->
    <g transform="translate(0, 434)">
      <rect x="0" y="0" width="880" height="58" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="30" y="34" font-size="12" font-weight="800" text-anchor="middle" fill="#0369a1">7</text>
      <text x="75" y="26" font-size="12" font-weight="800" fill="#0f172a">Kompetensi Tenaga Medis</text>
      <text x="75" y="42" font-size="10.5" fill="#64748b">(SDMK Bersertifikasi)</text>
      <g transform="translate(410, 18)" font-size="11" fill="#1e293b" font-weight="500">
        <text x="0" y="0">• Dokter Umum (ATLS/ACLS/GELS), Dokter Gigi, Apoteker Terdaftar.</text>
        <text x="0" y="16">• Perawat Terlatih BTCLS &amp; Penyelamatan Maritim Bahari Kepulauan.</text>
        <text x="0" y="32">• Bidan Terlatih APN/PONED &amp; Analis Kesehatan bersertifikasi Kemenkes.</text>
      </g>
    </g>

    <!-- Row 8: Penanganan Pengaduan -->
    <g transform="translate(0, 492)">
      <rect x="0" y="0" width="880" height="66" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="30" y="38" font-size="12" font-weight="800" text-anchor="middle" fill="#0369a1">8</text>
      <text x="75" y="26" font-size="12" font-weight="800" fill="#0f172a">Penanganan Pengaduan,</text>
      <text x="75" y="42" font-size="12" font-weight="800" fill="#0f172a">Saran &amp; Masukan Pasien</text>
      <g transform="translate(410, 18)" font-size="11" fill="#1e293b" font-weight="500">
        <text x="0" y="0">• Kotak Saran &amp; Kuisioner Kepuasan Pasien di setiap pulau.</text>
        <text x="0" y="16">• WhatsApp Hotline 24 Jam: 0812-9000-8500 (Respon Maksimal 1x24 Jam).</text>
        <text x="0" y="32">• Portal Resmi: puskesmasseribuselatan.com / CRM Pengaduan Pemprov DKI (JAKI).</text>
      </g>
    </g>

    <!-- Row 9: Jaminan Pelayanan & Keamanan -->
    <g transform="translate(0, 558)">
      <rect x="0" y="0" width="880" height="54" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="30" y="32" font-size="12" font-weight="800" text-anchor="middle" fill="#0369a1">9</text>
      <text x="75" y="24" font-size="12" font-weight="800" fill="#0f172a">Jaminan Pelayanan &amp;</text>
      <text x="75" y="40" font-size="12" font-weight="800" fill="#0f172a">Keselamatan Pasien</text>
      <g transform="translate(410, 18)" font-size="11" fill="#1e293b" font-weight="500">
        <text x="0" y="0">• Pelayanan diselenggarakan sesuai Maklumat Pelayanan dan SOP Akreditasi Paripurna.</text>
        <text x="0" y="16">• Perlindungan data medis pasien terjamin kerahasiaannya sesuai UU Kesehatan No. 17/2023.</text>
      </g>
    </g>
  </g>

  <!-- ================= TANDA TANGAN RESMI PIMPINAN ================= -->
  <g transform="translate(680, 1070)" font-family="'Segoe UI', Roboto, sans-serif">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#1e293b">Ditetapkan di: Pulau Tidung</text>
    <text x="0" y="18" font-size="13" font-weight="700" fill="#1e293b">Pada tanggal: 2 Januari 2026</text>
    <text x="0" y="45" font-size="13.5" font-weight="800" fill="#0f172a">Kepala Puskesmas Kecamatan</text>
    <text x="0" y="63" font-size="13.5" font-weight="800" fill="#0f172a">Kepulauan Seribu Selatan</text>

    <!-- Stempel Dinas Kesehatan -->
    <g transform="translate(-35, 110) scale(0.75)" opacity="0.85">
      <circle cx="0" cy="0" r="54" fill="none" stroke="#1d4ed8" stroke-width="3" stroke-dasharray="2 1" />
      <circle cx="0" cy="0" r="50" fill="none" stroke="#1d4ed8" stroke-width="2" />
      <circle cx="0" cy="0" r="32" fill="none" stroke="#1d4ed8" stroke-width="1.5" />
      <text x="0" y="4" font-size="8" font-weight="900" fill="#1d4ed8" text-anchor="middle">PUSKESMAS</text>
    </g>

    <!-- Tanda Tangan -->
    <g stroke="#1e40af" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.9">
      <path d="M -10 100 Q 15 70 35 105 T 75 90 Q 95 115 120 95" />
      <path d="M 15 90 L 45 120 L 80 95" />
      <path d="M 0 115 L 125 115" stroke-width="1.5" />
    </g>

    <text x="0" y="160" font-size="14.5" font-weight="900" fill="#0f172a">dr. Ignatius Dendy Purnama</text>
    <text x="0" y="178" font-size="12" font-weight="700" fill="#475569">NIP. 198503222010012031</text>
  </g>
</svg>
