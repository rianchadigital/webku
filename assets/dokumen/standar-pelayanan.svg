      <text x="30" y="34" font-size="12" font-weight="800" text-anchor="middle" fill="#0369a1">6</text>
      <text x="75" y="26" font-size="12" font-weight="800" fill="#0f172a">Sarana, Prasarana &amp;</text>
      <text x="75" y="42" font-size="12" font-weight="800" fill="#0f172a">Fasilitas Penunjang</text>
      <g transform="translate(410, 18)" font-size="11" fill="#1e293b" font-weight="500">
