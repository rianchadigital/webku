      <rect x="0" y="0" width="880" height="74" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="30" y="42" font-size="12" font-weight="800" text-anchor="middle" fill="#0369a1">5</text>
      <text x="75" y="32" font-size="12" font-weight="800" fill="#0f172a">Produk Pelayanan</text>
      <text x="75" y="48" font-size="10.5" fill="#64748b">(Faskes Darat &amp; Maritim)</text>
      <g transform="translate(410, 18)" font-size="11" fill="#1e293b" font-weight="500">
