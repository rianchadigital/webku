        <text x="0" y="16">• Armada Kapal Ambulans Laut Evakuasi Medis Terintegrasi Antar-Pulau.</text>
        <text x="0" y="32">• Poli Siklus Hidup (KIA/KB, Balita, Gigi, Usia Produktif, TB DOTS, Lansia Geriatri).</text>
        <text x="0" y="48">• Laboratorium Terpadu, Farmasi &amp; Konseling Gizi / Sanitasi.</text>
      </g>
