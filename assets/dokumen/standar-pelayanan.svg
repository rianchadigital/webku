<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400" width="100%" height="100%">
  <defs>
    <linearGradient id="docHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <filter id="docShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Paper White Background -->
  <rect width="1000" height="1400" fill="#f8fafc" />
  <rect x="25" y="25" width="950" height="1350" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#docShadow)" />

  <!-- Double Border Frame -->
  <rect x="35" y="35" width="930" height="1330" rx="8" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="8 4" />

  <!-- ================= KOP SURAT RESMI ================= -->
  <g transform="translate(60, 50)">
    <!-- DKI Jaya Raya Shield Left -->
    <g transform="translate(45, 45) scale(0.9)">
      <path d="M -32 -48 L 32 -48 L 32 0 C 32 30, 0 45, 0 45 C 0 45, -32 30, -32 0 Z" fill="#ffffff" stroke="#d97706" stroke-width="2.5" />
      <path d="M -28 -44 L 28 -44 L 28 -2 C 28 26, 0 38, 0 38 C 0 38, -28 26, -28 -2 Z" fill="#0284c7" />
      <path d="M -5 15 L 5 15 L 3 -18 L -3 -18 Z" fill="#ffffff" />
      <polygon points="0,-30 -3,-18 3,-18" fill="#fbbf24" stroke="#d97706" stroke-width="1" />
      <rect x="-12" y="15" width="24" height="5" fill="#ffffff" rx="1" />
      <path d="M -20 24 Q -10 20 0 24 Q 10 28 20 24" stroke="#ffffff" stroke-width="2" fill="none" />
      <rect x="-32" y="-60" width="64" height="14" fill="#e11d48" rx="2" stroke="#b91c1c" stroke-width="1" />
      <text x="0" y="-50" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="900" letter-spacing="1" text-anchor="middle">JAYA RAYA</text>
    </g>

    <!-- Kop Text -->
    <g text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" fill="#0f172a">
      <text x="440" y="24" font-size="18" font-weight="800" letter-spacing="1">PEMERINTAH PROVINSI DAERAH KHUSUS IBUKOTA JAKARTA</text>
      <text x="440" y="46" font-size="20" font-weight="900" letter-spacing="1" fill="#0369a1">DINAS KESEHATAN</text>
      <text x="440" y="70" font-size="17" font-weight="800" letter-spacing="0.5">PUSAT KESEHATAN MASYARAKAT KECAMATAN KEPULAUAN SERIBU SELATAN</text>
      <text x="440" y="90" font-size="11.5" font-weight="600" fill="#475569">Jl. Pelabuhan Tidung, RT 003 / RW 01, Kelurahan Pulau Tidung, Kepulauan Seribu Selatan - Telp/WA: 0812-9000-8500</text>
    </g>

    <!-- Kemenkes / Puskesmas Logo Right -->
    <g transform="translate(835, 45) scale(0.9)">
      <polygon points="0,-48 38,-26 38,26 0,48 -38,26 -38,-26" fill="#ffffff" stroke="#047857" stroke-width="2.5" />
      <circle cx="0" cy="0" r="28" fill="#ffffff" stroke="#047857" stroke-width="1.5" />
      <path d="M -7 -20 L 7 -20 L 7 -7 L 20 -7 L 20 7 L 7 7 L 7 20 L -7 20 L -7 7 L -20 7 L -20 -7 L -7 -7 Z" fill="#047857" />
    </g>

    <!-- Double Rule Divider -->
    <line x1="0" y1="105" x2="880" y2="105" stroke="#0f172a" stroke-width="3" />
    <line x1="0" y1="110" x2="880" y2="110" stroke="#0f172a" stroke-width="1" />
  </g>

  <!-- ================= JUDUL DOKUMEN ================= -->
  <g transform="translate(500, 185)" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif">
    <rect x="-350" y="0" width="700" height="42" rx="8" fill="url(#docHeaderGrad)" />
    <text x="0" y="27" fill="#ffffff" font-size="18" font-weight="900" letter-spacing="1.5">STANDAR PELAYANAN PUBLIK</text>
    <text x="0" y="65" fill="#0f172a" font-size="13" font-weight="700">KEPUTUSAN KEPALA PUSKESMAS KEPULAUAN SERIBU SELATAN</text>
    <text x="0" y="82" fill="#475569" font-size="11.5" font-weight="600">Nomor: 18 / TAHUN 2026 - TENTANG STANDAR PELAYANAN FASILITAS KESEHATAN TINGKAT PERTAMA</text>
  </g>

  <!-- ================= TABEL 10 KOMPONEN STANDAR PELAYANAN ================= -->
  <g transform="translate(60, 290)" font-family="'Segoe UI', Roboto, sans-serif">
    <!-- Table Header -->
    <rect x="0" y="0" width="880" height="34" fill="#0369a1" rx="4" />
    <text x="30" y="22" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">NO</text>
    <line x1="60" y1="0" x2="60" y2="34" stroke="#ffffff" stroke-width="1.5" />
    <text x="230" y="22" fill="#ffffff" font-size="12" font-weight="800">KOMPONEN PELAYANAN</text>
    <line x1="390" y1="0" x2="390" y2="34" stroke="#ffffff" stroke-width="1.5" />
    <text x="635" y="22" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">URAIAN STANDAR PELAYANAN PUSKESMAS</text>

    <!-- Row 1: Persyaratan Pelayanan -->
    <g transform="translate(0, 34)">
      <rect x="0" y="0" width="880" height="68" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="30" y="38" font-size="12" font-weight="800" text-anchor="middle" fill="#0369a1">1</text>
      <text x="75" y="28" font-size="12" font-weight="800" fill="#0f172a">Persyaratan Pelayanan</text>
      <text x="75" y="46" font-size="10.5" fill="#64748b">(Administrasi &amp; Registrasi)</text>
      <g transform="translate(410, 18)" font-size="11" fill="#1e293b" font-weight="500">
        <text x="0" y="0">• KTP DKI Jakarta / KK (Identitas Kependudukan Resmi).</text>
        <text x="0" y="16">• Kartu BPJS Kesehatan / KIS Aktif faskes Kepulauan Seribu.</text>
        <text x="0" y="32">• Pasien Darurat (IGD 24 Jam): Dilayani LANGSUNG tanpa syarat administrasi awal.</text>
      </g>
    </g>

    <!-- Row 2: Sistem, Mekanisme & Prosedur -->
    <g transform="translate(0, 102)">
      <rect x="0" y="0" width="880" height="74" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="30" y="42" font-size="12" font-weight="800" text-anchor="middle" fill="#0369a1">2</text>
      <text x="75" y="28" font-size="12" font-weight="800" fill="#0f172a">Sistem, Mekanisme &amp;</text>
      <text x="75" y="44" font-size="12" font-weight="800" fill="#0f172a">Prosedur Pelayanan</text>
      <g transform="translate(410, 18)" font-size="11" fill="#1e293b" font-weight="500">
        <text x="0" y="0">1. Pendaftaran, Nomor Antrean &amp; Skrining Awal Integrasi Layanan Primer (ILP).</text>
        <text x="0" y="16">2. Pemeriksaan Tanda Vital, Anamnesa &amp; Konsultasi Dokter / Dokter Gigi / Bidan.</text>
        <text x="0" y="32">3. Pemeriksaan Laboratorium / TCM TB (bila diperlukan).</text>
        <text x="0" y="48">4. Pelayanan Resep Farmasi / Rujukan Kapal Ambulans Laut (bila indikasi gawat darurat).</text>
      </g>
    </g>

    <!-- Row 3: Waktu Penyelesaian -->
    <g transform="translate(0, 176)">
      <rect x="0" y="0" width="880" height="66" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
      <text x="30" y="38" font-size="12" font-weight="800" text-anchor="middle" fill="#0369a1">3</text>
      <text x="75" y="32" font-size="12" font-weight="800" fill="#0f172a">Jangka Waktu Penyelesaian</text>
      <text x="75" y="48" font-size="10.5" fill="#64748b">(Waktu Tanggap Standar)</text>
      <g transform="translate(410, 18)" font-size="11" fill="#1e293b" font-weight="500">
        <text x="0" y="0">• IGD &amp; Triase Gawat Darurat: Respon Medis &lt; 5 Menit (Siaga 24 Jam Non-stop).</text>
        <text x="0" y="16">• Poli Rawat Jalan: 15 – 20 Menit per pasien.</text>
        <text x="0" y="32">• Pelayanan Farmasi Obat: 10 – 15 Menit (Obat Non-Racikan) / 20 Menit (Racikan).</text>
      </g>
    </g>

    <!-- Row 4: Biaya / Tarif -->
    <g transform="translate(0, 242)">
      <rect x="0" y="0" width="880" height="58" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <text x="30" y="34" font-size="12" font-weight="800" text-anchor="middle" fill="#0369a1">4</text>
      <text x="75" y="26" font-size="12" font-weight="800" fill="#0f172a">Biaya / Tarif Pelayanan</text>
      <text x="75" y="42" font-size="10.5" fill="#16a34a" font-weight="700">GRATIS (Rp 0,-)</text>
      <g transform="translate(410, 18)" font-size="11" fill="#1e293b" font-weight="500">
        <text x="0" y="0" font-weight="800" fill="#15803d">• Rp 0,- (GRATIS) bagi seluruh Pemegang Kartu BPJS Kesehatan / KIS Aktif.</text>
        <text x="0" y="16" font-weight="800" fill="#15803d">• Rp 0,- (GRATIS) bagi seluruh Warga Ber-KTP Provinsi DKI Jakarta.</text>
        <text x="0" y="32">• Pasien Umum Luar DKI tanpa BPJS: Sesuai Perda Retribusi Daerah Provinsi DKI Jakarta.</text>
      </g>
    </g>

    <!-- Row 5: Produk Pelayanan -->
